name: Build native applications

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build VibeDock
        run: ./scripts/build-macos.sh

      - name: Package application bundle
        run: tar -czf VibeDock-macos-arm64.tar.gz -C bin VibeDock.app

      - name: Upload macOS application
        uses: actions/upload-artifact@v7
        with:
          name: vibedock-macos-arm64
          path: VibeDock-macos-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14

  ubuntu:
    name: Ubuntu (x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build VibeDock
        run: ./scripts/build-ubuntu.sh --install-deps

      - name: Package executable
        run: tar -czf VibeDock-ubuntu-x64.tar.gz -C bin vibedock

      - name: Upload Ubuntu executable
        uses: actions/upload-artifact@v7
        with:
          name: vibedock-ubuntu-x64
          path: VibeDock-ubuntu-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  fedora:
    name: Fedora (x64)
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 30
    steps:
      - name: Prepare Fedora container
        run: dnf install -y git tar gzip

      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build VibeDock
        run: ./scripts/build-fedora.sh --install-deps

      - name: Package executable
        run: tar -czf VibeDock-fedora-x64.tar.gz -C bin vibedock

      - name: Upload Fedora executable
        uses: actions/upload-artifact@v7
        with:
          name: vibedock-fedora-x64
          path: VibeDock-fedora-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows (x64)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build VibeDock
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Package executable
        shell: pwsh
        run: Compress-Archive -Path bin/vibedock.exe -DestinationPath VibeDock-windows-x64.zip -Force

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: vibedock-windows-x64
          path: VibeDock-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
